name: token-config-review
description: Deterministic arithmetic/config review for token contracts (supply, fees, decimals, vesting).
workflow:
  - Review max supply, fee bounds, decimals, reward rates, vesting, allocation totals, BPS sums.
  - State assumptions; do not claim full economic security.
permissions:
  filesystem_read: true
  filesystem_write: false
  shell: true
  network: false
  secrets: false
inputs:
  - path
outputs:
  - token config review JSON
